name: Report a phone number
description: Submit a Philippine mobile number for maintainer review
title: "[Report]: auto-filled after submission"
labels: [report, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping protect the community. Issues are public. Do not include names, screenshots, OTPs, addresses, account balances, or other personal information.
  - type: input
    id: number
    attributes:
      label: Phone number
      description: Use a Philippine mobile format such as 09171234567 or +639171234567.
      placeholder: +639XXXXXXXXX
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Phishing SMS
        - Impersonation
        - Fake delivery
        - Investment scam
        - Loan scam
        - Advance-fee scam
        - Robocall
        - Spam
        - Other
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date observed
      description: Use YYYY-MM-DD. Do not submit an incident more than 90 days old without a public source.
      placeholder: "2026-07-28"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Contact channel
      options:
        - Phone call
        - SMS
        - WhatsApp
        - Viber
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Briefly describe the tactic. Redact all personal and financial information.
      placeholder: The sender impersonated a delivery company and requested payment through a link.
    validations:
      required: true
  - type: input
    id: public_reference
    attributes:
      label: Public reference (optional)
      description: A government advisory, news report, or other non-personal public source.
  - type: checkboxes
    id: declarations
    attributes:
      label: Declaration
      options:
        - label: I have removed personal, financial, and authentication information.
          required: true
        - label: I am reporting in good faith and understand that submission does not guarantee publication.
          required: true
        - label: I understand that intentionally false reports may be rejected and restricted.
          required: true
