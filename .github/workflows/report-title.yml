name: Report title

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  sync-title:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';

            function field(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return body.match(new RegExp(`^### ${escaped}\\s+([\\s\\S]*?)(?=\\n###|$(?![\\s\\S]))`, 'm'))?.[1].trim();
            }

            function normalizeNumber(value) {
              let number = value.trim().replace(/[\s().-]/g, '');
              if (number.startsWith('0063')) number = `+63${number.slice(4)}`;
              if (number.startsWith('63')) number = `+${number}`;
              if (number.startsWith('0')) number = `+63${number.slice(1)}`;
              return /^\+63(?:9\d{9}|[2-8]\d{8})$/.test(number) ? number : '';
            }

            const singleNumber = normalizeNumber(field('Phone number')?.split(/\r?\n/)[0] ?? '');
            const bulkNumbers = (field('Phone numbers') ?? '')
              .split(/\r?\n/)
              .map(normalizeNumber)
              .filter(Boolean);
            const numbers = singleNumber ? [singleNumber] : [...new Set(bulkNumbers)];
            if (!numbers.length) return;

            const category = field('Category')?.split(/\r?\n/)[0]?.trim();
            if (!category) return;

            const listedNumbers = numbers.slice(0, 3).join(', ');
            const title = numbers.length <= 3
              ? `[Report]: ${listedNumbers} (${category})`
              : `[Report]: Bulk Submission #${context.issue.number} (${category})`;
            if (context.payload.issue.title === title) return;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title
            });
