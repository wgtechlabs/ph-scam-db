name: Report title

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  sync-title:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';

            function field(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              return body.match(new RegExp(`^### ${escaped}\\s+([\\s\\S]*?)(?=\\n###|$)`, 'm'))?.[1].trim();
            }

            let number = field('Phone number')?.split(/\r?\n/)[0]?.trim() ?? '';
            number = number.replace(/[\s().-]/g, '');
            if (number.startsWith('0063')) number = `+63${number.slice(4)}`;
            if (number.startsWith('63')) number = `+${number}`;
            if (number.startsWith('09')) number = `+63${number.slice(1)}`;
            if (!/^\+639\d{9}$/.test(number)) return;

            const category = field('Category')?.split(/\r?\n/)[0]?.trim();
            if (!category) return;

            const title = `[Report]: ${number} (${category})`;
            if (context.payload.issue.title === title) return;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title
            });
